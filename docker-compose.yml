services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: edu_flow_ai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed-basic.sql:/docker-entrypoint-initdb.d/02-seed-basic.sql
      - ./db/seed-profiles.sql:/docker-entrypoint-initdb.d/03-seed-profiles.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-api:
    build:
      context: .
      dockerfile: ml/Dockerfile
    environment:
      DB_URL: jdbc:mysql://db:3306/edu_flow_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      ML_LOG_LEVEL: ${ML_LOG_LEVEL:-INFO}
      ML_GA_PROFILE: ${ML_GA_PROFILE:-default}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DB_URL: jdbc:mysql://db:3306/edu_flow_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      ML_API_URL: http://ml-api:8000
      OPENAI_CHAT_API_KEY: ${OPENAI_CHAT_API_KEY}
      OPENAI_CHAT_BASE_URL: ${OPENAI_CHAT_BASE_URL}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-deepseek-v4-flash}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      ml-api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mysql_data:

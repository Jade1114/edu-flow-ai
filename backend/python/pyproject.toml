[project]
name = "edu-flow-ml"
version = "1.0.0"
description = "Edu-Flow-AI ML Service — V3 scheduling pipeline"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "ortools>=9.11",
    "lightgbm>=4.6",
    "pandas>=2.2",
    "pydantic>=2.10",
    "python-dotenv>=1.1",
    "pymysql>=1.1",
    "mysql-connector-python>=9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

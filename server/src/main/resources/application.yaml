spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: edu-flow-ai-server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/edu_flow_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}

app:
  vector-store:
    provider: qdrant
    qdrant:
      host: ${QDRANT_HOST:localhost}
      port: ${QDRANT_PORT:6334}
      api-key: ${QDRANT_API_KEY:}
      collection: ${QDRANT_COLLECTION:teacher_profiles}
      vector-size: ${QDRANT_VECTOR_SIZE:1536}

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: edu-flow-ai-server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/edu_flow_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  type-handlers-package: com.yuy.eduflow.enums

# logging 交由 logback-spring.xml 统一管理
server:
  port: ${SERVER_PORT:8080}

app:
  embedding:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  chat:
    openai:
      api-key: ${OPENAI_CHAT_API_KEY:}
      base-url: ${OPENAI_CHAT_BASE_URL:}
      model: ${OPENAI_CHAT_MODEL:deepseek-v4-pro}
  vector-store:
    provider: qdrant
    qdrant:
      url: ${QDRANT_URL:http://localhost:6333}
      api-key: ${QDRANT_API_KEY:}
      collection: ${QDRANT_COLLECTION:teacher_profiles}
      vector-size: ${QDRANT_VECTOR_SIZE:1536}
